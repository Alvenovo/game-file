<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线上签字</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f2f5;color:#333;display:flex;flex-direction:column;min-height:100vh}
header{background:linear-gradient(135deg,#4a90d9,#357abd);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:600}
.toolbar{margin-left:auto;display:flex;gap:8px}
.btn{padding:7px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-primary{background:#fff;color:#357abd;font-weight:600}
.btn-primary:hover{background:#f0f0f0}
.btn-success{background:#27ae60;color:#fff}
.btn-success:hover{background:#219a52}
main{flex:1;display:flex;gap:12px;padding:12px;overflow:auto}
.doc-panel{flex:1;background:#fff;border-radius:10px;box-shadow:0 1px 8px rgba(0,0,0,.08);padding:12px;display:flex;flex-direction:column;min-width:0}
.doc-panel h2{font-size:13px;color:#888;margin-bottom:8px}
.img-container{flex:1;overflow:auto;border:1px solid #eee;border-radius:6px;background:#fafafa;position:relative}
.img-bg{position:relative;width:100%;min-width:600px;aspect-ratio:1276/1344;background-size:100% 100%;background-repeat:no-repeat}
.tf{position:absolute;border:none;background:rgba(255,235,59,.15);outline:none;text-align:center;font-family:"Microsoft YaHei","SimSun",serif;color:#1a1a1a;border-bottom:1px solid rgba(255,193,7,.4);transition:background .2s,border-color .2s;line-height:1;padding:0;margin:0;border-radius:2px}
.tf:hover{background:rgba(255,235,59,.4);border-bottom:2px solid #ffc107}
.tf:focus{border-bottom:2px solid #4a90d9;background:rgba(74,144,217,.12)}
.tf.highlight{background:rgba(255,235,59,.3);border-bottom:1px solid #ffc107}
.sig-overlay{position:absolute;top:0;left:0;pointer-events:none}
.sig-el{position:absolute;cursor:move;pointer-events:auto;user-select:none;border:2px dashed transparent}
.sig-el:hover{border-color:rgba(74,144,217,.4)}
.sig-el.sel{border-color:#4a90d9}
.sig-el img{display:block;width:100%;height:100%;pointer-events:none}
.sig-el .rz{position:absolute;bottom:-5px;right:-5px;width:12px;height:12px;background:#4a90d9;border:2px solid #fff;border-radius:50%;cursor:nwse-resize}
.sig-el .del{position:absolute;top:-10px;right:-10px;width:20px;height:20px;background:#e74c3c;color:#fff;border:2px solid #fff;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.side-panel{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 8px rgba(0,0,0,.08);padding:14px}
.card h2{font-size:13px;color:#888;margin-bottom:10px}
.pad-wrap{position:relative;border:1px solid #e0e0e0;border-radius:6px;overflow:hidden;background:#fff}
canvas#pad{display:block;cursor:crosshair;touch-action:none;width:100%}
.pad-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ccc;font-size:14px;pointer-events:none}
.ctl-row{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.ctl-row label{font-size:12px;color:#888;min-width:36px}
.swatches{display:flex;gap:5px}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw.act{border-color:#4a90d9}
input[type=range]{flex:1;accent-color:#4a90d9}
.val{font-size:12px;color:#999;min-width:28px;text-align:right}
.btn-row{display:flex;gap:6px;margin-top:8px}
.btn-row .btn-s{flex:1}
.btn-s{padding:6px 10px;font-size:12px;border:none;border-radius:5px;cursor:pointer;font-family:inherit}
.btn-gray{background:#eee;color:#555}.btn-red{background:#fff;color:#e74c3c;border:1px solid #e74c3c}
.btn-blue{background:#4a90d9;color:#fff}
.btn-blue:hover{background:#357abd}
.share-box{margin-top:8px}
.share-box textarea{width:100%;font-size:11px;padding:8px;border:1px solid #ddd;border-radius:4px;resize:none;height:60px;color:#666}
.link-info{font-size:11px;color:#999;margin-top:4px}
.info-box{font-size:12px;color:#888;line-height:1.6}
.info-box b{color:#555}
@media(max-width:768px){main{flex-direction:column}.side-panel{width:100%;flex-direction:row;flex-wrap:wrap}.side-panel .card{flex:1;min-width:250px}.img-container img.bg{max-height:50vh}}
</style>
</head>

<span style="font-size:20px">🖊️</span>

</div>
</header>

<script>
(function(){
'use strict';
var IMG_W=1276,IMG_H=1344;
var bg=document.getElementById('bg');
var imgBox=document.getElementById('imgBox');
var overlay=document.getElementById('overlay');
var pad=document.getElementById('pad');
var pctx=pad.getContext('2d');
var hint=document.getElementById('hint');
var swatches=document.getElementById('swatches');
var pw=document.getElementById('pw');
var pwv=document.getElementById('pwv');
var undoBtn=document.getElementById('undoBtn');
var clrBtn=document.getElementById('clrBtn');
var placeBtn=document.getElementById('placeBtn');
var shareBtn=document.getElementById('shareBtn');
var exportBtn=document.getElementById('exportBtn');
var shareBox=document.getElementById('shareBox');
var shareUrl=document.getElementById('shareUrl');
var linkInfo=document.getElementById('linkInfo');
var shareInfo=document.getElementById('shareInfo');
var hlBtn=document.getElementById('hlBtn');
var hlOn=false;
hlBtn.onclick=function(){
hlOn=!hlOn;
var tfs=document.querySelectorAll('.tf');
for(var i=0;i<tfs.length;i++){tfs[i].classList.toggle('highlight',hlOn)}
hlBtn.textContent=hlOn?'📍 隐藏编辑位置':'📍 显示编辑位置';
};

// 下划线位置 (x%, y_offset%, w%, isLarge)
var FIELDS=[
[38.48,18.53,7.76],[48.67,18.53,6.58],[57.68,18.53,6.51],
[61.83,23.44,7.37],[74.22,23.44,8.54],
[64.18,91.52,5.33],[72.03,91.52,4.31],[78.76,91.52,4.23]
];

var penColor='#1a1a1a',penW=2.5,drawing=false,strokes=[],cur=[],sigEls=[];
var COLORS=['#1a1a1a','#e74c3c','#2c3e50'];

COLORS.forEach(function(c,i){
var s=document.createElement('div');
s.className='sw'+(i===0?' act':'');
s.style.background=c;
s.onclick=function(){penColor=c;[].forEach.call(swatches.children,function(e){e.classList.remove('act')});s.classList.add('act')};
swatches.appendChild(s);
});
pw.oninput=function(){penW=parseFloat(this.value);pwv.textContent=penW};

// Create text fields
FIELDS.forEach(function(f,i){
var inp=document.createElement('input');
inp.type='text';inp.className='tf';inp.id='f'+i;
inp.style.left=f[0]+'%';inp.style.top=f[1]+'%';inp.style.width=f[2]+'%';
bg.appendChild(inp);
});

// Adjust font sizes
function adjustFonts(){
var w=bg.offsetWidth;if(!w)return;
var h=bg.offsetHeight;
var scale=w/IMG_W;
var fs=Math.max(14,20*scale);
var fH=fs*1.6;
[].forEach.call(bg.querySelectorAll('.tf'),function(el,i){
var f=FIELDS[i];if(!f)return;
el.style.fontSize=fs+'px';el.style.height=fH+'px';
el.style.left=f[0]+'%';el.style.width=f[2]+'%';
el.style.top=((f[1]/100*h)-fH)+'px';
});
overlay.style.width='100%';overlay.style.height='100%';overlay.style.left='0';overlay.style.top='0';
}
bg.onload=adjustFonts;
window.addEventListener('resize',adjustFonts);
if(bg.complete&&bg.naturalWidth>0)adjustFonts();

// Signature pad
function getPos(e){
var r=pad.getBoundingClientRect();
var cx=e.touches?e.touches[0].clientX:e.clientX;
var cy=e.touches?e.touches[0].clientY:e.clientY;
return{x:(cx-r.left)*pad.width/r.width,y:(cy-r.top)*pad.height/r.height};
}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};
function drawStroke(ctx,s){
if(!s.length)return;
ctx.strokeStyle=s[0].c;ctx.lineWidth=s[0].w;ctx.lineCap='round';ctx.lineJoin='round';
if(s.length===1){ctx.beginPath();ctx.arc(s[0].x,s[0].y,s[0].w/2,0,Math.PI*2);ctx.fillStyle=s[0].c;ctx.fill();return}
ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);
for(var i=1;i<s.length-1;i++){var m=mid(s[i],s[i+1]);ctx.quadraticCurveTo(s[i].x,s[i].y,m.x,m.y)}
var l=s[s.length-1];ctx.lineTo(l.x,l.y);ctx.stroke();
}
function redraw(){pctx.clearRect(0,0,pad.width,pad.height);strokes.forEach(function(s){drawStroke(pctx,s)});if(drawing&&cur.length)drawStroke(pctx,cur);hint.style.display=(strokes.length||drawing)?'none':'block'}
function sDraw(e){e.preventDefault();drawing=true;var p=getPos(e);cur=[{x:p.x,y:p.y,c:penColor,w:penW}]}
function mDraw(e){if(!drawing)return;e.preventDefault();var p=getPos(e);cur.push({x:p.x,y:p.y,c:penColor,w:penW});redraw()}
function eDraw(){if(drawing&&cur.length)strokes.push(cur);drawing=false;cur=[];redraw()}
pad.addEventListener('mousedown',sDraw);pad.addEventListener('mousemove',mDraw);
pad.addEventListener('mouseup',eDraw);pad.addEventListener('mouseleave',eDraw);
pad.addEventListener('touchstart',sDraw,{passive:false});
pad.addEventListener('touchmove',mDraw,{passive:false});
pad.addEventListener('touchend',eDraw);
undoBtn.onclick=function(){strokes.pop();redraw()};
clrBtn.onclick=function(){strokes=[];redraw()};

// Trim
function trimSig(){
var mx=1e9,my=1e9,Mx=-1,My=-1;
var all=strokes.slice();if(drawing)all.push(cur);
all.forEach(function(s){s.forEach(function(p){var r=p.w/2;mx=Math.min(mx,p.x-r);my=Math.min(my,p.y-r);Mx=Math.max(Mx,p.x+r);My=Math.max(My,p.y+r)})});
if(mx>1e8)return null;
var p=4;mx=Math.max(0,mx-p);my=Math.max(0,my-p);Mx=Math.min(pad.width,Mx+p);My=Math.min(pad.height,My+p);
var w=Mx-mx,h=My-my;if(w<5||h<5)return null;
var c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);
var ctx=c.getContext('2d');ctx.translate(-mx,-my);strokes.forEach(function(s){drawStroke(ctx,s)});
return{url:c.toDataURL('image/png'),w:c.width,h:c.height};
}

// Place signature
placeBtn.onclick=function(){
if(!strokes.length){alert('请先手写签名');return}
var t=trimSig();if(!t){alert('签名内容太少');return}
var d=document.createElement('div');d.className='sig-el';
var im=document.createElement('img');im.src=t.url;d.appendChild(im);
var rz=document.createElement('div');rz.className='rz';d.appendChild(rz);
var del=document.createElement('div');del.className='del';del.innerHTML='×';d.appendChild(del);
var imgRect=bg.getBoundingClientRect();var boxRect=imgBox.getBoundingClientRect();
var tw=imgRect.width*0.22;
d.style.width=tw+'px';d.style.height=(tw*t.h/t.w)+'px';
d.style.left=((imgRect.width-tw)*0.92)+'px';
d.style.top=((imgRect.height-tw*t.h/t.w)*0.92)+'px';
overlay.appendChild(d);
var obj={el:d,url:t.url};sigEls.push(obj);
sigEls.forEach(function(s){s.el.classList.remove('sel')});obj.el.classList.add('sel');
bindSigEl(d,obj);
strokes=[];redraw();
};

function bindSigEl(d,obj){
d.addEventListener('mousedown',function(e){if(e.target.classList.contains('rz')||e.target.classList.contains('del'))return;e.preventDefault();sigEls.forEach(function(s){s.el.classList.remove('sel')});obj.el.classList.add('sel');drag(e,d)});
d.addEventListener('touchstart',function(e){if(e.target.classList.contains('rz')||e.target.classList.contains('del'))return;e.preventDefault();sigEls.forEach(function(s){s.el.classList.remove('sel')});obj.el.classList.add('sel');drag(e,d)},{passive:false});
d.querySelector('.rz').addEventListener('mousedown',function(e){e.preventDefault();e.stopPropagation();resize(e,d)});
d.querySelector('.rz').addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();resize(e,d)},{passive:false});
d.querySelector('.del').onclick=function(e){e.preventDefault();e.stopPropagation();var idx=sigEls.indexOf(obj);if(idx>=0)sigEls.splice(idx,1);d.remove()};
}

function drag(e,el){
var sx=e.touches?e.touches[0].clientX:e.clientX,sy=e.touches?e.touches[0].clientY:e.clientY;
var ol=parseFloat(el.style.left),ot=parseFloat(el.style.top);
function mv(ev){var dx=(ev.touches?ev.touches[0].clientX:ev.clientX)-sx,dy=(ev.touches?ev.touches[0].clientY:ev.clientY)-sy;el.style.left=(ol+dx)+'px';el.style.top=(ot+dy)+'px'}
function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up)}
document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
document.addEventListener('touchmove',mv,{passive:false});document.addEventListener('touchend',up);
}
function resize(e,el){
var sx=e.touches?e.touches[0].clientX:e.clientX,sy=e.touches?e.touches[0].clientY:e.clientY;
var ow=el.offsetWidth,oh=el.offsetHeight;
function mv(ev){var dx=(ev.touches?ev.touches[0].clientX:ev.clientX)-sx;var nw=Math.max(30,ow+dx);el.style.width=nw+'px';el.style.height=(nw*oh/ow)+'px'}
function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up)}
document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
document.addEventListener('touchmove',mv,{passive:false});document.addEventListener('touchend',up);
}
document.addEventListener('mousedown',function(e){if(!e.target.closest('.sig-el')){sigEls.forEach(function(s){s.el.classList.remove('sel')})}});

// === State sharing ===
function encodeState(){
var fields={};
FIELDS.forEach(function(f,i){var el=document.getElementById('f'+i);if(el.value)fields['f'+i]=el.value});
var sigs=sigEls.map(function(s){
var ir=bg.getBoundingClientRect(),br=imgBox.getBoundingClientRect(),er=s.el.getBoundingClientRect();
return{url:s.url,l:(er.left-ir.left)/ir.width,t:(er.top-ir.top)/ir.height,w:er.width/ir.width,h:er.height/ir.height};
});
return JSON.stringify({f:fields,s:sigs});
}
function restoreState(st){
if(!st)return;
if(st.f)Object.keys(st.f).forEach(function(k){var el=document.getElementById(k);if(el)el.value=st.f[k]});
if(st.s)st.s.forEach(function(sig){
var d=document.createElement('div');d.className='sig-el';
var im=document.createElement('img');im.src=sig.url;d.appendChild(im);
var rz=document.createElement('div');rz.className='rz';d.appendChild(rz);
var del=document.createElement('div');del.className='del';del.innerHTML='×';d.appendChild(del);
var ir=bg.getBoundingClientRect(),br=imgBox.getBoundingClientRect();
d.style.left=(sig.l*ir.width)+'px';
d.style.top=(sig.t*ir.height)+'px';
d.style.width=(sig.w*ir.width)+'px';d.style.height=(sig.h*ir.height)+'px';
overlay.appendChild(d);
var obj={el:d,url:sig.url};sigEls.push(obj);bindSigEl(d,obj);
});
}
var stateLoaded=false;
function checkUrlState(){
if(stateLoaded)return;stateLoaded=true;
var h=location.hash;
if(h.indexOf('d=')>=0){
var enc=h.substring(h.indexOf('d=')+2);
try{
var json=decodeURIComponent(escape(atob(enc)));
var st=JSON.parse(json);
if(st){restoreState(st);shareInfo.innerHTML='<b style="color:#27ae60">✅ 已加载对方填写的内容</b><br>你可以继续签字，然后生成新的分享链接或直接导出图片。';}
}catch(e){console.error(e)}
}
}

shareBtn.onclick=function(){
var json=encodeState();
var enc=btoa(unescape(encodeURIComponent(json)));
var url=location.origin+location.pathname+'#d='+enc;
shareBox.style.display='block';
shareUrl.value=url;
linkInfo.textContent='URL长度: '+url.length+' 字符。复制此链接发给对方。';
shareUrl.select();
try{document.execCommand('copy')}catch(e){}
};

exportBtn.onclick=function(){
var imgSrc=bg.style.backgroundImage.slice(5,-2);
var img=new Image();
img.onload=function(){
var c=document.createElement('canvas');c.width=IMG_W;c.height=IMG_H;
var ctx=c.getContext('2d');ctx.drawImage(img,0,0);
FIELDS.forEach(function(f,i){
var el=document.getElementById('f'+i),txt=el.value;if(!txt)return;
var fs=parseFloat(el.style.fontSize)||14,scale=IMG_W/bg.offsetWidth,cfs=fs*scale;
var x=(f[0]/100)*IMG_W+(f[2]/100)*IMG_W*0.5;
var y=(f[1]/100)*IMG_H;
ctx.font=cfs+'px "Microsoft YaHei","SimSun",serif';ctx.fillStyle='#1a1a1a';
ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(txt,x,y);
});
var ir=bg.getBoundingClientRect(),sx=IMG_W/ir.width,sy=IMG_H/ir.height;
var pending=sigEls.length;
if(!pending){dl(c);return}
sigEls.forEach(function(s){
var im=new Image();im.onload=function(){
var r=s.el.getBoundingClientRect();
ctx.drawImage(im,(r.left-ir.left)*sx,(r.top-ir.top)*sy,r.width*sx,r.height*sy);
pending--;if(!pending)dl(c);
};im.src=s.url;
});
function dl(c){var a=document.createElement('a');a.download='signed.png';a.href=c.toDataURL('image/png');a.click()}
};
img.src=imgSrc;
};

redraw();
function init(){adjustFonts();checkUrlState();autoHighlight()}
window.addEventListener('load',init);
setTimeout(init,100);
setTimeout(init,500);
if(typeof ResizeObserver!=='undefined'){new ResizeObserver(function(){adjustFonts()}).observe(bg)}
function autoHighlight(){
if(!hlOn){hlBtn.click()}
}
})();
</script>
</body>
</html>
